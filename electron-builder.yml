appId: com.verticallive.app
productName: Vertical Live
# The on-disk executable name, kept free of spaces for shortcuts and scripting.
executableName: VerticalLive
copyright: Copyright © 2026 Vertical Live

directories:
  output: release
  buildResources: build

# The renderer, preload and main are bundled by electron-vite into out/, so the
# only node_modules electron-builder needs to pack is the production dependency
# tree — currently just electron-updater (+ its own deps), which must be
# require()-able at runtime. electron-builder resolves that from `dependencies`
# automatically; the globs below only govern the app's own source.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.DS_Store,.git,.gitignore,.editorconfig}'

# FFmpeg must live OUTSIDE the asar archive: an executable cannot be spawned
# from inside a virtual asar filesystem. `extraResources` places it at
# <install dir>/resources/ffmpeg/ffmpeg.exe, which is what FfmpegLocator
# resolves via process.resourcesPath.
# Only ffmpeg.exe ships. ffprobe is a ~100 MB developer convenience used by the
# integration test from the repo checkout; the app itself never invokes it.
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - 'ffmpeg.exe'
  # The real brand icon, used at runtime for the frameless window and taskbar.
  - from: build/icon.png
    to: icon.png

asar: true
# No native modules, so skip the rebuild step entirely.
npmRebuild: false
buildDependenciesFromSource: false

win:
  target:
    - target: nsis
      arch:
        - x64
  # The real 1126px brand PNG; electron-builder generates the multi-size ICO.
  icon: build/icon.png
  # Vertical Live writes only to the per-user app data directory and to the
  # recording folder the user chooses, so it never needs elevation.
  requestedExecutionLevel: asInvoker
  # Space-free on purpose: electron-updater matches the asset name in latest.yml
  # exactly, and a space (which GitHub and the feed encode differently) is a
  # classic cause of "update download 404". `${name}` is the package.json name.
  artifactName: ${name}-${version}-Setup-${arch}.${ext}
  fileAssociations: []

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vertical Live
  uninstallDisplayName: Vertical Live ${version}
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  # Branded wizard artwork, generated by scripts/generate-installer-assets.mjs
  # (run automatically by the package/dist scripts).
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp

# Auto-update feed: GitHub Releases on the public repo. `electron-builder
# --publish` uploads the installer + latest.yml here; the shipped app's
# electron-updater polls the same repo's newest release. Generating a build also
# writes app-update.yml into the package from this block.
publish:
  provider: github
  owner: alexuzor
  repo: vertical-live
